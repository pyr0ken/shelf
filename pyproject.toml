[project]
name = "shelf"
version = "0.1.0"
description = "Intelligent Local-First Technical Library & RAG Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
shelf = "shelf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
