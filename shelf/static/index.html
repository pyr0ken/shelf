<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelf | Local Technical Library & RAG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#090a0f',
            surface: '#11131a',
            surfaceHover: '#181b24',
            border: '#1e2230',
            accent: '#6366f1',
            accentLight: '#818cf8',
            accentCyan: '#06b6d4',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090a0f; }
    ::-webkit-scrollbar-thumb { background: #1e2230; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #31374a; }
    
    .prose code { color: #38bdf8; background: #181b24; padding: 2px 5px; border-radius: 4px; font-size: 0.875em; }
    .prose pre { background: #0f1118; border: 1px solid #1e2230; padding: 12px; border-radius: 8px; overflow-x: auto; }
    .prose p { margin-bottom: 0.75rem; }
  </style>
</head>
<body class="bg-bg text-slate-100 min-h-screen font-sans selection:bg-indigo-500/30" x-data="shelfApp()">

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-40 bg-bg/90 backdrop-blur-md border-b border-border px-6 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      
      <!-- Brand & Mode Switch -->
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
          </div>
          <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">SHELF</span>
        </div>

        <nav class="flex items-center bg-surface p-1 rounded-xl border border-border">
          <button @click="tab = 'books'" :class="tab === 'books' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'" class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            Library
          </button>
          <button @click="tab = 'rag'" :class="tab === 'rag' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'" class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            Ask RAG
          </button>
        </nav>
      </div>

      <!-- Search Bar -->
      <div class="relative w-full max-w-md">
        <input 
          type="text" 
          x-model="searchQuery" 
          @input.debounce.300ms="fetchBooks()"
          placeholder="Search books, topics, authors (Ctrl+K)..." 
          id="searchInput"
          class="w-full bg-surface border border-border rounded-xl px-4 py-2 pl-9 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500/80 focus:ring-1 focus:ring-indigo-500 transition"
        />
        <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-6 py-6">

    <!-- View 1: Bookshelf Grid -->
    <div x-show="tab === 'books'" x-transition>
      
      <!-- Category Filter Pills -->
      <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-4 scrollbar-none">
        <button 
          @click="selectedCategory = ''; fetchBooks()" 
          :class="selectedCategory === '' ? 'bg-indigo-500/20 text-indigo-400 border-indigo-500/40' : 'bg-surface text-slate-400 border-border hover:border-slate-700'"
          class="px-3 py-1.5 rounded-lg text-xs font-medium border transition whitespace-nowrap">
          All Books (<span x-text="totalBooksCount"></span>)
        </button>
        <template x-for="cat in categories" :key="cat.category">
          <button 
            @click="selectedCategory = cat.category; fetchBooks()" 
            :class="selectedCategory === cat.category ? 'bg-indigo-500/20 text-indigo-400 border-indigo-500/40' : 'bg-surface text-slate-400 border-border hover:border-slate-700'"
            class="px-3 py-1.5 rounded-lg text-xs font-medium border transition whitespace-nowrap">
            <span x-text="cat.category"></span>
            <span class="text-slate-500 ml-1" x-text="cat.count"></span>
          </button>
        </template>
      </div>

      <!-- Books Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5">
        <template x-for="book in books" :key="book.id">
          <div 
            @click="openModal(book)"
            class="group bg-surface rounded-xl border border-border hover:border-indigo-500/50 transition duration-200 overflow-hidden cursor-pointer flex flex-col justify-between shadow-sm hover:shadow-lg hover:shadow-indigo-500/5 hover:-translate-y-0.5">
            
            <!-- Book Cover -->
            <div class="aspect-[3/4] bg-surfaceHover relative overflow-hidden flex items-center justify-center">
              <template x-if="book.cover_path">
                <img :src="'/api/covers/' + book.cover_path" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" />
              </template>
              <template x-if="!book.cover_path">
                <div class="p-4 text-center">
                  <span class="text-3xl">📖</span>
                  <p class="text-[10px] text-slate-400 mt-2 line-clamp-3" x-text="book.title"></p>
                </div>
              </template>
              
              <!-- Format & RAG Tag -->
              <div class="absolute top-2 left-2 flex gap-1">
                <span class="bg-black/70 backdrop-blur text-white text-[9px] uppercase font-mono px-1.5 py-0.5 rounded border border-white/10" x-text="book.format"></span>
                <template x-if="book.is_indexed_rag">
                  <span class="bg-indigo-600/90 text-white text-[9px] font-mono px-1.5 py-0.5 rounded shadow">RAG</span>
                </template>
              </div>

              <!-- Page Count -->
              <span class="absolute bottom-2 right-2 bg-black/70 backdrop-blur text-slate-300 text-[10px] font-mono px-1.5 py-0.5 rounded" x-text="(book.page_count || '?') + 'p'"></span>
            </div>

            <!-- Book Info -->
            <div class="p-3">
              <span class="text-[10px] font-mono text-indigo-400 block truncate" x-text="book.category"></span>
              <h3 class="text-xs font-semibold text-slate-200 mt-0.5 line-clamp-2 leading-tight group-hover:text-indigo-300 transition" x-text="book.title"></h3>
            </div>

          </div>
        </template>
      </div>

    </div>

    <!-- View 2: Ask RAG View -->
    <div x-show="tab === 'rag'" x-transition class="max-w-4xl mx-auto">
      
      <!-- Ask Box -->
      <div class="bg-surface border border-border rounded-2xl p-6 shadow-xl mb-8">
        <div class="flex items-center gap-2 mb-4">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
          <h2 class="text-sm font-semibold text-slate-200">Grounded Technical RAG Engine</h2>
          
          <!-- LLM Toggle Switch -->
          <div class="flex items-center gap-2 ml-auto">
            <span class="text-[11px] font-mono text-slate-400" x-text="ragUseLLM ? 'LLM Synthesis: ON' : 'Fast Raw Search: NO-LLM'"></span>
            <button 
              type="button"
              @click="ragUseLLM = !ragUseLLM" 
              :class="ragUseLLM ? 'bg-indigo-600' : 'bg-slate-700'"
              class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
              <span 
                :class="ragUseLLM ? 'translate-x-4' : 'translate-x-0'"
                class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out">
              </span>
            </button>
          </div>
        </div>

        <form @submit.prevent="askRAG()">
          <div class="flex flex-col sm:flex-row gap-3">
            <select x-model="ragCategory" class="bg-surfaceHover border border-border rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
              <option value="">All Categories</option>
              <template x-for="cat in categories" :key="cat.category">
                <option :value="cat.category" x-text="cat.category"></option>
              </template>
            </select>

            <input 
              type="text" 
              x-model="ragQuestion" 
              placeholder="Ask anything from your 250+ technical books (e.g., 'How does Raft handle network partitions?')..." 
              class="w-full bg-surfaceHover border border-border rounded-xl px-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
            />

            <button 
              type="submit" 
              :disabled="ragLoading || !ragQuestion.trim()"
              class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-medium text-xs px-5 py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 shrink-0 shadow-lg shadow-indigo-600/20">
              <span x-show="!ragLoading">Ask Books</span>
              <span x-show="ragLoading" class="animate-spin text-sm">⏳</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Answer Card -->
      <template x-if="ragResult">
        <div class="bg-surface border border-border rounded-2xl p-6 shadow-xl space-y-6">
          <div>
            <h3 class="text-xs font-mono text-indigo-400 uppercase tracking-wider mb-2">Answer:</h3>
            <div class="prose text-xs text-slate-200 leading-relaxed" x-html="renderMarkdown(ragResult.answer)"></div>
          </div>

          <!-- Sources -->
          <template x-if="ragResult.sources && ragResult.sources.length > 0">
            <div class="pt-6 border-t border-border">
              <h4 class="text-xs font-mono text-cyan-400 uppercase tracking-wider mb-3">Verified Sources & Citations:</h4>
              <div class="space-y-3">
                <template x-for="(s, idx) in ragResult.sources" :key="idx">
                  <div class="bg-surfaceHover/60 border border-border/80 rounded-xl p-3.5 text-xs">
                    <div class="flex items-center justify-between mb-1.5">
                      <div class="flex items-center gap-2">
                        <span class="w-5 h-5 rounded-md bg-indigo-500/20 text-indigo-300 font-mono text-[10px] flex items-center justify-center font-bold" x-text="idx + 1"></span>
                        <span class="font-semibold text-slate-200" x-text="s.book_title"></span>
                        <span class="text-slate-500 font-mono text-[10px]">Page <span class="text-amber-400 font-bold" x-text="s.page_number"></span></span>
                        <template x-if="s.chapter_title">
                          <span class="text-slate-400 text-[10px] hidden sm:inline" x-text="'(' + s.chapter_title + ')'"></span>
                        </template>
                      </div>
                      <button 
                        @click="launchBook(s.book_id, s.page_number)" 
                        class="px-2.5 py-1 bg-surface border border-border hover:border-indigo-500 text-[10px] font-mono rounded text-slate-300 hover:text-white transition flex items-center gap-1">
                        Open Page ↗
                      </button>
                    </div>
                    <p class="text-slate-400 text-[11px] font-mono leading-relaxed bg-black/20 p-2.5 rounded border border-white/5" x-text="s.content"></p>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>

    </div>

  </main>

  <!-- Book Detail Modal -->
  <div 
    x-show="activeBook" 
    x-transition.opacity
    class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
    @keydown.escape.window="activeBook = null">
    
    <div 
      @click.outside="activeBook = null" 
      class="bg-surface border border-border rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[90vh] flex flex-col">
      
      <button @click="activeBook = null" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">✕</button>

      <div class="flex gap-6 mb-6">
        <div class="w-36 aspect-[3/4] bg-surfaceHover rounded-xl overflow-hidden shrink-0 border border-border">
          <template x-if="activeBook && activeBook.cover_path">
            <img :src="'/api/covers/' + activeBook.cover_path" class="w-full h-full object-cover" />
          </template>
        </div>
        <div class="flex flex-col justify-between">
          <div>
            <span class="text-xs font-mono text-indigo-400" x-text="activeBook?.category"></span>
            <h2 class="text-base font-bold text-white mt-1 leading-snug" x-text="activeBook?.title"></h2>
            <div class="flex gap-2 text-xs font-mono text-slate-400 mt-3">
              <span x-text="activeBook?.page_count + ' Pages'"></span>
              <span>•</span>
              <span class="uppercase" x-text="activeBook?.format"></span>
              <span>•</span>
              <span x-text="((activeBook?.file_size || 0) / 1024 / 1024).toFixed(1) + ' MB'"></span>
            </div>
          </div>

          <div class="flex gap-3 mt-4">
            <button 
              @click="launchBook(activeBook.id)" 
              class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
              Open in System Reader
            </button>
            <button 
              @click="askAboutBook(activeBook)" 
              class="bg-surfaceHover border border-border hover:border-slate-600 text-slate-200 text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-1.5">
              Ask AI about Book
            </button>
          </div>
        </div>
      </div>

      <!-- Table of Contents Section -->
      <div class="flex-1 overflow-y-auto border-t border-border pt-4">
        <h3 class="text-xs font-mono text-slate-400 uppercase tracking-wider mb-2">Table of Contents</h3>
        <template x-if="activeBookToc.length === 0">
          <p class="text-xs text-slate-500 italic">No bookmarks/TOC found in this file.</p>
        </template>
        <div class="space-y-1">
          <template x-for="item in activeBookToc" :key="item.title + item.page">
            <div 
              @click="launchBook(activeBook.id, item.page)"
              class="flex items-center justify-between text-xs py-1.5 px-2 rounded hover:bg-surfaceHover cursor-pointer text-slate-300 hover:text-white transition"
              :style="'padding-left: ' + (item.level * 12) + 'px'">
              <span class="truncate pr-4" x-text="item.title"></span>
              <span class="font-mono text-[10px] text-slate-500 shrink-0" x-text="'p. ' + item.page"></span>
            </div>
          </template>
        </div>
      </div>

    </div>
  </div>

  <script>
    function shelfApp() {
      return {
        tab: 'books',
        books: [],
        categories: [],
        totalBooksCount: 0,
        selectedCategory: '',
        searchQuery: '',
        activeBook: null,
        activeBookToc: [],
        
        // RAG state
        ragCategory: '',
        ragQuestion: '',
        ragUseLLM: true,
        ragLoading: false,
        ragResult: null,

        init() {
          this.fetchCategories();
          this.fetchBooks();

          // Keyboard shortcut Ctrl+K
          window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
              e.preventDefault();
              document.getElementById('searchInput')?.focus();
            }
          });
        },

        async fetchCategories() {
          const res = await fetch('/api/categories');
          const data = await res.json();
          this.categories = data.categories || [];
          this.totalBooksCount = this.categories.reduce((acc, c) => acc + c.count, 0);
        },

        async fetchBooks() {
          let url = `/api/books?limit=150`;
          if (this.selectedCategory) url += `&category=${encodeURIComponent(this.selectedCategory)}`;
          if (this.searchQuery) url += `&query=${encodeURIComponent(this.searchQuery)}`;
          const res = await fetch(url);
          const data = await res.json();
          this.books = data.books || [];
        },

        openModal(book) {
          this.activeBook = book;
          this.activeBookToc = book.toc_json ? JSON.parse(book.toc_json) : [];
        },

        async launchBook(bookId, page = null) {
          await fetch(`/api/books/${bookId}/open`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ page: page })
          });
        },

        askAboutBook(book) {
          this.activeBook = null;
          this.tab = 'rag';
          this.ragCategory = book.category;
          this.ragQuestion = `What are the core concepts covered in ${book.title}?`;
        },

        async askRAG() {
          if (!this.ragQuestion.trim()) return;
          this.ragLoading = true;
          this.ragResult = null;
          try {
            const res = await fetch('/api/rag/ask', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                question: this.ragQuestion,
                category: this.ragCategory || null,
                top_k: 5,
                use_llm: this.ragUseLLM
              })
            });
            this.ragResult = await res.json();
          } catch (e) {
            this.ragResult = { answer: 'Error connecting to RAG backend: ' + e.message, sources: [] };
          } finally {
            this.ragLoading = false;
          }
        },

        renderMarkdown(text) {
          if (!text) return '';
          return marked.parse(text);
        }
      }
    }
  </script>

</body>
</html>
